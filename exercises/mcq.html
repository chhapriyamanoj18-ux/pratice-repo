<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>EVS Image Quiz</title>

    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="../assets/CSS/mcq.css">
</head>

<body>

    <div class="quiz">


        <!-- QUESTION TEXT -->
        <div class="question-box" id="question"></div>

        <!-- IMAGE + OPTIONS -->
        <div class="card">
            <div class="image-box">
                <img id="questionImg">
            </div>

            <div class="options-box" id="options"></div>
        </div>

        <div class="controls">
            <button class="prev" id="prevBtn" disabled>← Prev</button>
            <button class="next" id="nextBtn" disabled>Next →</button>
        </div>
    </div>

    <!-- CORRECT / WRONG POPUP -->
    <div id="answerPopup" class="popup">
        <div class="popup-content">
            <div class="popup-icon" id="popupIcon"></div>
            <h3 id="popupTitle"></h3>
            <p id="popupMsg"></p>
        </div>
    </div>

    <!-- FINAL POPUP -->
    <div id="finalPopup">
        <div class=" finalpopup-box">
            <h2 class="final-heading">🎉 Congratulations!</h2>
            <p id="finalScore"></p>
            <div id="stars"></div><br> <button onclick="location.reload()" class="playAgain-btn"> Play Again </button>
        </div>
    </div>

    <script src="../assets/JavaScript/mcq.js"></script>
</body>
</html>
